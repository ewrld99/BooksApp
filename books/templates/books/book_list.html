<h1>Books</h1>
<a href="{% url 'books:book_create' %}">Add a book</a>

<ul>
  {% for book in books %}
    <li>
      <a href="{% url 'books:book_detail' book.pk %}">{{ book.title }}</a>
      — {{ book.author }}
      <a href="{% url 'books:book_update' book.pk %}">Edit</a>
      <a href="{% url 'books:book_delete' book.pk %}">Delete</a>
    </li>
  {% empty %}
    <li>No books yet.</li>
  {% endfor %}
</ul>
